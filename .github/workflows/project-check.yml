name: Project Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "Checking project..."
          ls -la

      - name: Check README
        run: test -f README.md

      - name: Check index
        run: test -f index.html

      - name: Project check passed
        run: echo "✅ Project is ready!"